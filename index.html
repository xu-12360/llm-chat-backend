<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>我的AI聊天机器人</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
    .msg { margin: 5px 0; padding: 8px; border-radius: 8px; }
    .user { background: #dbeafe; text-align: right; }
    .ai { background: #f3f6f4; }
    input { width: 80%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>😎 我的专属AI</h1>
  <div id="chat-box"></div>
  <input id="input" placeholder="输入你的问题...">
  <button onclick="send()">提问</button>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const box = document.getElementById("chat-box");
      const question = input.value.trim();
      if (!question) return;

      box.innerHTML += `<div class="msg user">${question}</div>`;
      input.value = "";

      const res = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: question }),
      });
      const data = await res.json();
      const answer = data.data.answer;

      box.innerHTML += `<div class="msg ai">${answer}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
